<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome | Exam ERP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="auth-mobile.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-hero-text">
            Log In to stay on top of your tasks and projects.
        </div>
        <div class="auth-illustration">
            <img src="auth_illustration.jpg" alt="Productivity Illustration">
        </div>
        
        <div class="auth-card">
            <h1 class="onboarding-brand auth-title">EXAM ERP</h1>
            <h2 class="onboarding-title auth-title">Let's Get You Set Up for Success</h2>
            <p class="onboarding-desc">Organize your workflow and manage tasks easily all in one simple, powerful app.</p>
            
            <div style="display: flex; align-items: center; justify-content: center; width: 100%; margin: 25px 0;">
                <img src="ERP_logo.png" alt="ERP Logo" style="max-width: 160px; height: auto;">
            </div>
            
            <a href="login.html" class="btn-animated">
                <div class="btn-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
                        <path d="M224 480h640a32 32 0 1 1 0 64H224a32 32 0 0 1 0-64z"></path>
                        <path d="m237.248 512 265.408 265.344a32 32 0 0 1-45.312 45.312l-288-288a32 32 0 0 1 0-45.312l288-288a32 32 0 1 1 45.312 45.312L237.248 512z"></path>
                    </svg>
                </div>
                <p>Get started</p>
            </a>
        </div>
    </div>
</body>
</html>
